apiVersion: apps/v1
kind: StatefulSet
metadata:
  creationTimestamp: null
  labels:
    app: shoes-boutique
  name: shoes-boutique
  namespace: mall-shops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shoes-boutique
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: shoes-boutique
    spec:
      serviceAccountName: cashier
      volumes:
      - name: shared-data
        emptyDir: {}
      - name: config-volume
        configMap:
          name: mall-prices
      - persistentVolumeClaim:
          claimName: warehouse-pvc
        name: warehouse-data
      containers:
      - image: nginx:alpine
        name: nginx
        resources: {}
        ports:
        - containerPort: 80
        volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
        - name: config-volume
          mountPath: /etc/config
        - name: warehouse-data
          mountPath: /var/lib/shoes
      initContainers:
      - image: busybox:1.36
        name: init-con
        command: ["sh","-c",'echo "Welcome to the Grand Opening!" > /usr/share/nginx/html/index.html']
        volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
status: {}
