apiVersion: apps/v1
kind: StatefulSet
metadata:
  creationTimestamp: null
  labels:
    app: shoes-boutique
  name: shoes-boutique
  namespace: mall-shops
spec:
  serviceName: "shoes-boutique-svc"
  replicas: 2
  selector:
    matchLabels:
      app: shoes-boutique
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: shoes-boutique
    spec:
      serviceAccountName: cashier
      volumes:
      - name: config-volume
        configMap: 
          name: mall-prices
      - name: shared-data
        emptyDir: {}
      - name: warehouse-data
        persistentVolumeClaim:
          claimName: warehouse-pvc
      initContainers:
      - name: init-myservice
        image: busybox:1.36
        command: ["sh", "-c", 'echo "Welcome to the Grand Opening!" > /usr/share/nginx/html/index.html']
        volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
      containers:
      - image: nginx:alpine
        name: nginx
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - test
            - -f
            - /etc/config/shoes
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: 64Mi
            cpu: 250m
          limits:
            memory: 128Mi
            cpu: 500m
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
        - name: shared-data
          mountPath: /usr/share/nginx/html
        - name: warehouse-data
          mountPath: /var/lib/shoes
status: {}
