apiVersion: apps/v1
kind: StatefulSet
metadata:
  creationTimestamp: null
  labels:
    app: shoes-boutique
  name: shoes-boutique
  namespace: mall-shops
spec:
  serviceName: "shoes-boutique-svc"
  replicas: 2
  selector:
    matchLabels:
      app: shoes-boutique
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: shoes-boutique
    spec:
      serviceAccountName: cashier
      volumes:
      - name: config-volume
        configMap: 
          name: mall-prices
      - name: shared-data
        emptyDir: {}
      - name: warehouse-data
        persistentVolumeClaim:
          claimName: warehouse-pvc
      initContainers:
      - name: init-myservice
        image: busybox:1.36
        command: ["sh", "-c", 'echo "Welcome to the Grand Opening!" > /usr/share/nginx/html/index.html']
        volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
      containers:
      - image: nginx:alpine
        name: nginx
        resources: {}
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
        - name: shared-data
          mountPath: /usr/share/nginx/html
        - name: warehouse-data
          mountPath: /var/lib/shoes
status: {}
