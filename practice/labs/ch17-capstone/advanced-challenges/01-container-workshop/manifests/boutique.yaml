apiVersion: v1
kind: Namespace
metadata:
  name: mall-workshop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-workshop
  namespace: mall-workshop
spec:
  replicas: 1
  selector:
    matchLabels: {app: container-workshop}
  template:
    metadata:
      labels: {app: container-workshop}
    spec:
      containers:
      - name: nginx
        image: central-mall/boutique:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: container-workshop
  namespace: mall-workshop
spec:
  selector: {app: container-workshop}
  ports:
  - port: 80
    targetPort: 80
